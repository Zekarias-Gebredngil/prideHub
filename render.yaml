# ==============================================================================
# PrideHub - Render Blueprint Specification (100% FREE Tier)
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # ── Backend Web Service (NestJS REST API + WebSockets) ─────────────────────
  - type: web
    name: pridehub-backend
    runtime: node
    plan: free # 100% Free Tier (512MB RAM, 0.1 CPU)
    region: oregon # or frankfurt, ohio, singapore
    rootDir: backend
    buildCommand: npm ci --legacy-peer-deps && npx prisma generate && npm run build
    startCommand: npx prisma db push --accept-data-loss && node dist/main.js
    healthCheckPath: /api/v1
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        sync: false # Set to your deployed frontend URL (e.g. https://pridehub-frontend.onrender.com)
      - key: API_URL
        sync: false # Set to your backend URL (e.g. https://pridehub-backend.onrender.com)
      - key: DATABASE_URL
        fromDatabase:
          name: pridehub-postgres
          property: connectionString
      - key: REDIS_URL
        sync: false # Optional: Paste a free Upstash Redis URL (redis://default:***@***.upstash.io:6379) or leave blank
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: COOKIE_SECRET
        generateValue: true
      - key: SWAGGER_ENABLED
        value: "true"
      - key: STORAGE_PROVIDER
        value: local # Change to 'cloudinary' or 's3' for persistent cloud storage
      - key: UPLOAD_DIR
        value: ./uploads
      - key: THROTTLE_TTL
        value: "60"
      - key: THROTTLE_LIMIT
        value: "100"
      - key: COMMISSION_DEFAULT_RATE
        value: "0.10"
      - key: PLATFORM_FEE_RATE
        value: "0.03"
      - key: ESCROW_HOLD_DAYS
        value: "7"
      # Payment & Third-party configurations (fill in Render Dashboard)
      - key: CHAPA_SECRET_KEY
        sync: false
      - key: CHAPA_PUBLIC_KEY
        sync: false
      - key: CHAPA_ENCRYPTION_KEY
        sync: false
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        value: PrideHub <noreply@pridehub.com>

  # ── Frontend Static Site (Angular 20 SPA) ──────────────────────────────────
  - type: web
    name: pridehub-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build:prod
    staticPublishPath: ./dist/prideHub/browser
    pullRequestPreviewsEnabled: true
    routes:
      # Rewrite all non-file requests to index.html for Angular SPA routing
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

# ── Managed PostgreSQL Database (Free Tier) ───────────────────────────────────
databases:
  - name: pridehub-postgres
    plan: free # 100% Free Tier (1GB storage, 90-day expiry)
    databaseName: pridehub_db
    user: pridehub
    region: oregon
